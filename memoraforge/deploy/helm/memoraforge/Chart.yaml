apiVersion: v2
name: memoraforge
description: MemoraForge — Autonomous AI Agent Platform with 5M+ Token Memory
type: application
version: 0.1.0
appVersion: "0.1.0"
keywords:
  - ai
  - agents
  - memory
  - llm
  - rag
maintainers:
  - name: MemoraForge Team
dependencies:
  - name: postgresql
    version: "16.x.x"
    repository: "https://charts.bitnami.com/bitnami"
    condition: postgresql.enabled
  - name: redis
    version: "19.x.x"
    repository: "https://charts.bitnami.com/bitnami"
    condition: redis.enabled
  - name: neo4j
    version: "5.x.x"
    repository: "https://helm.neo4j.com/neo4j"
    condition: neo4j.enabled
