{{- if .Values.acpHandler.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "memoraforge.fullname" . }}-acp-handler
  labels:
    app.kubernetes.io/component: acp-handler
    {{- include "memoraforge.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.acpHandler.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/component: acp-handler
      {{- include "memoraforge.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        app.kubernetes.io/component: acp-handler
        {{- include "memoraforge.selectorLabels" . | nindent 8 }}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8300"
        prometheus.io/path: "/metrics"
    spec:
      securityContext:
        {{- toYaml .Values.security.podSecurityContext | nindent 8 }}
      containers:
        - name: acp-handler
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: {{ .Values.acpHandler.command | toJson }}
          ports:
            - name: http
              containerPort: 8300
              protocol: TCP
          env:
            {{- range $key, $value := .Values.acpHandler.env }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
            - name: POSTGRES_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "memoraforge.fullname" . }}-secrets
                  key: postgres-url
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "memoraforge.fullname" . }}-secrets
                  key: redis-url
          resources:
            {{- toYaml .Values.acpHandler.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          securityContext:
            {{- toYaml .Values.security.containerSecurityContext | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "memoraforge.fullname" . }}-acp-handler
  labels:
    app.kubernetes.io/component: acp-handler
    {{- include "memoraforge.labels" . | nindent 4 }}
spec:
  type: {{ .Values.acpHandler.service.type }}
  ports:
    - port: {{ .Values.acpHandler.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    app.kubernetes.io/component: acp-handler
    {{- include "memoraforge.selectorLabels" . | nindent 4 }}
{{- end }}
