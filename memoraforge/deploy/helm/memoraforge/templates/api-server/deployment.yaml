{{- if .Values.apiServer.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "memoraforge.fullname" . }}-api-server
  labels:
    app.kubernetes.io/component: api-server
    {{- include "memoraforge.labels" . | nindent 4 }}
spec:
  {{- if not .Values.apiServer.autoscaling.enabled }}
  replicas: {{ .Values.apiServer.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      app.kubernetes.io/component: api-server
      {{- include "memoraforge.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        app.kubernetes.io/component: api-server
        {{- include "memoraforge.selectorLabels" . | nindent 8 }}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      securityContext:
        {{- toYaml .Values.security.podSecurityContext | nindent 8 }}
      containers:
        - name: api-server
          image: "{{ .Values.apiServer.image.repository }}:{{ .Values.apiServer.image.tag }}"
          imagePullPolicy: {{ .Values.apiServer.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          env:
            {{- range $key, $value := .Values.apiServer.env }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
            - name: POSTGRES_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "memoraforge.fullname" . }}-secrets
                  key: postgres-url
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "memoraforge.fullname" . }}-secrets
                  key: redis-url
          resources:
            {{- toYaml .Values.apiServer.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: {{ .Values.apiServer.probes.liveness.path }}
              port: http
            initialDelaySeconds: {{ .Values.apiServer.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.apiServer.probes.liveness.periodSeconds }}
          readinessProbe:
            httpGet:
              path: {{ .Values.apiServer.probes.readiness.path }}
              port: http
            initialDelaySeconds: {{ .Values.apiServer.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.apiServer.probes.readiness.periodSeconds }}
          securityContext:
            {{- toYaml .Values.security.containerSecurityContext | nindent 12 }}
---
{{- if .Values.apiServer.autoscaling.enabled }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "memoraforge.fullname" . }}-api-server
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "memoraforge.fullname" . }}-api-server
  minReplicas: {{ .Values.apiServer.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.apiServer.autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.apiServer.autoscaling.targetCPUUtilization }}
{{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "memoraforge.fullname" . }}-api-server
  labels:
    app.kubernetes.io/component: api-server
    {{- include "memoraforge.labels" . | nindent 4 }}
spec:
  type: {{ .Values.apiServer.service.type }}
  ports:
    - port: {{ .Values.apiServer.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    app.kubernetes.io/component: api-server
    {{- include "memoraforge.selectorLabels" . | nindent 4 }}
{{- end }}
