{{- if .Values.memoryHub.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "memoraforge.fullname" . }}-memory-hub
  labels:
    app.kubernetes.io/component: memory-hub
    {{- include "memoraforge.labels" . | nindent 4 }}
spec:
  {{- if not .Values.memoryHub.autoscaling.enabled }}
  replicas: {{ .Values.memoryHub.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      app.kubernetes.io/component: memory-hub
      {{- include "memoraforge.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        app.kubernetes.io/component: memory-hub
        {{- include "memoraforge.selectorLabels" . | nindent 8 }}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8200"
        prometheus.io/path: "/metrics"
    spec:
      securityContext:
        {{- toYaml .Values.security.podSecurityContext | nindent 8 }}
      containers:
        - name: memory-hub
          image: "{{ .Values.memoryHub.image.repository }}:{{ .Values.memoryHub.image.tag }}"
          imagePullPolicy: {{ .Values.memoryHub.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8200
              protocol: TCP
          env:
            {{- range $key, $value := .Values.memoryHub.env }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
            - name: POSTGRES_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "memoraforge.fullname" . }}-secrets
                  key: postgres-url
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "memoraforge.fullname" . }}-secrets
                  key: redis-url
            - name: NEO4J_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "memoraforge.fullname" . }}-secrets
                  key: neo4j-password
          resources:
            {{- toYaml .Values.memoryHub.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
          securityContext:
            {{- toYaml .Values.security.containerSecurityContext | nindent 12 }}
---
{{- if .Values.memoryHub.autoscaling.enabled }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "memoraforge.fullname" . }}-memory-hub
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "memoraforge.fullname" . }}-memory-hub
  minReplicas: {{ .Values.memoryHub.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.memoryHub.autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.memoryHub.autoscaling.targetCPUUtilization }}
{{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "memoraforge.fullname" . }}-memory-hub
  labels:
    app.kubernetes.io/component: memory-hub
    {{- include "memoraforge.labels" . | nindent 4 }}
spec:
  type: {{ .Values.memoryHub.service.type }}
  ports:
    - port: {{ .Values.memoryHub.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    app.kubernetes.io/component: memory-hub
    {{- include "memoraforge.selectorLabels" . | nindent 4 }}
{{- end }}
